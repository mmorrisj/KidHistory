name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push to main is always the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the suite: a red build should never reach the site.
      - run: npm test

      - run: npm run build

      # enablement turns Pages on (build type "workflow") the first time this
      # runs, so the repo needs no manual Settings change to go live.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A green deploy job only proves the artifact was accepted, not that the
      # site serves it. If Pages is still set to "Deploy from a branch", the
      # branch build republishes the repo root over this deployment ~20s later
      # and visitors get a blank page, with every job still green. Fail loudly
      # instead.
      - name: Verify the live site serves the built app
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"

          serves_bundle() {
            curl -sSL --max-time 20 "$url" 2>/dev/null | grep -q 'assets/index-'
          }

          # Phase 1: wait for this deployment to become visible.
          live=false
          for i in $(seq 1 20); do
            if serves_bundle; then live=true; break; fi
            echo "attempt $i: built assets not served yet"
            sleep 15
          done

          if [ "$live" != true ]; then
            echo "::error::$url never served the built bundle."
            curl -sSL --max-time 20 "$url" 2>/dev/null | head -40
            exit 1
          fi

          # Phase 2: hold. A single passing check proves only that the site was
          # correct for one instant. A competing publisher (the Pages branch
          # build) lands seconds later and overwrites this deployment, so
          # exiting on first success reports a green deploy for a blank site.
          echo "Built bundle is live. Holding 2 minutes to confirm it stays."
          for i in $(seq 1 6); do
            sleep 20
            if serves_bundle; then
              echo "hold $i/6: still serving the built bundle"
            else
              echo "::error::$url served the built bundle, then stopped."
              echo "Something else is publishing over this deployment."
              echo "Almost certainly Settings -> Pages -> Source is still"
              echo "'Deploy from a branch'. That branch build republishes the"
              echo "repo root, whose index.html is the Vite source shell"
              echo "referencing /src/main.jsx -- which 404s and renders blank."
              echo "Set Source to 'GitHub Actions' so this workflow is the"
              echo "only publisher."
              echo "--- what is actually being served now ---"
              curl -sSL --max-time 20 "$url" 2>/dev/null | head -40
              exit 1
            fi
          done

          echo "Stable: the live site is serving the built app."
