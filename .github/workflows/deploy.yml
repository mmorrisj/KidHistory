name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push to main is always the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the suite: a red build should never reach the site.
      - run: npm test

      - run: npm run build

      # enablement turns Pages on (build type "workflow") the first time this
      # runs, so the repo needs no manual Settings change to go live.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A green deploy job only proves the artifact was accepted, not that the
      # site serves it. If Pages is still set to "Deploy from a branch", the
      # branch build republishes the repo root over this deployment ~20s later
      # and visitors get a blank page, with every job still green. Fail loudly
      # instead.
      - name: Verify the live site serves the built app
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in $(seq 1 20); do
            body=$(curl -sSL --max-time 20 "$url" || true)
            if printf '%s' "$body" | grep -q 'assets/index-'; then
              echo "OK: the built bundle is being served."
              exit 0
            fi
            echo "attempt $i: built assets not served yet"
            sleep 15
          done
          echo "::error::$url is not serving the built bundle."
          echo "Most likely cause: Settings -> Pages -> Source is still"
          echo "'Deploy from a branch'. That publishes the repo root, whose"
          echo "index.html is the Vite source shell referencing /src/main.jsx,"
          echo "which 404s and renders a blank page. Set Source to"
          echo "'GitHub Actions' so this workflow is the only publisher."
          echo "--- what is actually being served ---"
          printf '%s' "$body" | head -40
          exit 1
